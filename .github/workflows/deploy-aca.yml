name: Deploy Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Azure Login (client secret)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 🔥 Build + Deploy directly from source (NO ACR)
      - name: Build & deploy (no ACR)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade

            az containerapp up \
              --name monkstacklms \
              --resource-group lms-rg \
              --environment managedEnvironment-lmsrg-8258 \
              --source . \
              --ingress external \
              --target-port 3000

      # 🔥 Configure secrets + env vars
      - name: Configure ACA secrets and env vars
        uses: azure/cli@v2
        with:
          inlineScript: |
            az extension add --name containerapp --upgrade

            az containerapp secret set \
              --name monkstacklms \
              --resource-group lms-rg \
              --secrets \
                database-url="${{ secrets.DATABASE_URL }}" \
                nextauth-secret="${{ secrets.NEXTAUTH_SECRET }}" \
                azure-ad-client-secret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
                acs-connection-string="${{ secrets.ACS_CONNECTION_STRING }}"

            az containerapp update \
              --name monkstacklms \
              --resource-group lms-rg \
              --set-env-vars \
                NODE_ENV=production \
                PORT=3000 \
                NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}" \
                NEXT_PUBLIC_AZURE_AD_CLIENT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_CLIENT_ID }}" \
                NEXT_PUBLIC_AZURE_AD_TENANT_ID="${{ vars.NEXT_PUBLIC_AZURE_AD_TENANT_ID }}" \
                NEXT_PUBLIC_AZURE_AD_REDIRECT_URI="${{ vars.NEXT_PUBLIC_AZURE_AD_REDIRECT_URI }}" \
                AZURE_AD_CLIENT_ID="${{ vars.AZURE_AD_CLIENT_ID }}" \
                AZURE_AD_TENANT_ID="${{ vars.AZURE_AD_TENANT_ID }}" \
                ACS_SENDER_ADDRESS="${{ vars.ACS_SENDER_ADDRESS }}" \
                ACS_DRY_RUN=false \
                APPLICATIONINSIGHTS_CONNECTION_STRING="${{ vars.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
                DATABASE_URL=secretref:database-url \
                NEXTAUTH_SECRET=secretref:nextauth-secret \
                AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret \
                ACS_CONNECTION_STRING=secretref:acs-connection-string