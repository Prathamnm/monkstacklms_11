name: Deploy Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: moonshine-lms
  ACR_NAME: monkstackacr
  ACR_LOGIN_SERVER: monkstackacr.azurecr.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 🔥 Ensure ACR exists (idempotent)
      - name: Ensure ACR exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr show --name $ACR_NAME --resource-group lms-rg >/dev/null 2>&1 || \
            az acr create \
              --name $ACR_NAME \
              --resource-group lms-rg \
              --sku Basic \
              --location centralindia

      # 🔥 FIXED: Login to ACR via Azure CLI (no username/password needed)
      - name: Login to ACR via Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr login --name $ACR_NAME

      # 🔥 Build & Push image
      - name: Build and Push Docker image
        run: |
          docker build -t $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 🔥 Deploy to Container App
      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name monkstacklms \
              --resource-group lms-rg \
              --image $ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 🔥 Set secrets + env
      - name: Configure secrets and env
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp secret set \
              --name monkstacklms \
              --resource-group lms-rg \
              --secrets \
                database-url="${{ secrets.DATABASE_URL }}" \
                nextauth-secret="${{ secrets.NEXTAUTH_SECRET }}" \
                azure-ad-client-secret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
                acs-connection-string="${{ secrets.ACS_CONNECTION_STRING }}"

            az containerapp update \
              --name monkstacklms \
              --resource-group lms-rg \
              --set-env-vars \
                NODE_ENV=production \
                PORT=3000 \
                NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}" \
                DATABASE_URL=secretref:database-url \
                NEXTAUTH_SECRET=secretref:nextauth-secret \
                AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret \
                ACS_CONNECTION_STRING=secretref:acs-connection-string