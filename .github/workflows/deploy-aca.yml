name: Deploy Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: moonshine-lms

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # 🔥 Create ACR if not exists (safe)
      - name: Ensure ACR exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az acr create \
              --name monkstackacr \
              --resource-group lms-rg \
              --sku Basic \
              --location centralindia \
              || echo "ACR already exists"

      # 🔥 Login to ACR
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: monkstackacr.azurecr.io

      # 🔥 Build & Push image
      - name: Build and Push Docker image
        run: |
          docker build -t monkstackacr.azurecr.io/moonshine-lms:${{ github.sha }} .
          docker push monkstackacr.azurecr.io/moonshine-lms:${{ github.sha }}

      # 🔥 Deploy to Container App
      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name monkstacklms \
              --resource-group lms-rg \
              --image monkstackacr.azurecr.io/moonshine-lms:${{ github.sha }}

      # 🔥 Set secrets + env
      - name: Configure secrets and env
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp secret set \
              --name monkstacklms \
              --resource-group lms-rg \
              --secrets \
                database-url="${{ secrets.DATABASE_URL }}" \
                nextauth-secret="${{ secrets.NEXTAUTH_SECRET }}" \
                azure-ad-client-secret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
                acs-connection-string="${{ secrets.ACS_CONNECTION_STRING }}"

            az containerapp update \
              --name monkstacklms \
              --resource-group lms-rg \
              --set-env-vars \
                NODE_ENV=production \
                PORT=3000 \
                NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}" \
                DATABASE_URL=secretref:database-url \
                NEXTAUTH_SECRET=secretref:nextauth-secret \
                AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret \
                ACS_CONNECTION_STRING=secretref:acs-connection-string